    <meta name="description" content="PRISM is a multi-protocol stream player. Twitch, YouTube, HLS, and DASH behind a single URL input, with a multi-engine fallback chain and a full Twitch channel explorer." />
    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PRISM" />
    <meta property="og:title" content="PRISM - Player Routing & Insight for Streaming Media" />
    <meta property="og:description" content="A streaming media player I built and shipped: paste any URL and it auto-detects how to play it, whether Twitch, YouTube, HLS, or DASH. It runs a multi-engine fallback chain so playback holds when one engine fails, plus a full Twitch channel explorer with profiles, clips, VODs, live stats, and embedded chat. React 19, TypeScript, Vite, deployed on GitHub Pages." />

    <meta name="twitter:image" content="https://prism.nooroticx.tv/og.png" />
    <!-- GitHub Pages SPA redirect handler (pairs with public/404.html) -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- Matomo -->
    <script>
      // Visit counting with the owner's own Matomo (stats.pollardjr.com, site 4): no cookies, and only on the address in the list,
      // so a local build or any other host does nothing. A visitor who sends Do Not Track or Global Privacy Control is not counted
      // and no request is made. The part of the address after the # is never sent: it holds the Twitch sign-in token on the way back
      // from signing in, and the handed-over list on /import (Matomo sends it unless told not to). It adds the class "counted" to
      // <html>, which shows the one-line note (.counted-note in index.css).
      // Tests: src/lib/__tests__/matomoBlock.test.ts.
      (function () {
        var sites = { 'prism.nooroticx.tv': '4' };
        if (!Object.prototype.hasOwnProperty.call(sites, location.hostname)) return;
        var dnt = navigator.doNotTrack || window.doNotTrack || navigator.msDoNotTrack;
        if (dnt === '1' || dnt === 'yes' || navigator.globalPrivacyControl === true) return;
        document.documentElement.classList.add('counted');
        var _paq = window._paq = window._paq || [];
        _paq.push(['disableCookies']);
        _paq.push(['setDoNotTrack', true]);
        _paq.push(['discardHashTag', true]);
        _paq.push(['trackPageView']);
        _paq.push(['enableLinkTracking']);
        var u = 'https://stats.pollardjr.com/';
        _paq.push(['setTrackerUrl', u + 'matomo.php']);
        _paq.push(['setSiteId', sites[location.hostname]]);
        var d = document, g = d.createElement('script'), s = d.getElementsByTagName('script')[0];
        g.async = true; g.src = u + 'matomo.js'; s.parentNode.insertBefore(g, s);
      })();
    </script>
    <!-- End Matomo -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
